name: PowerShell host compatibility

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.84.3", "0.87.1", "0.99.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Check isolated pinned host
        shell: pwsh
        run: npm run test:host -- --version "${{ matrix.pi }}" --artifacts "${{ runner.temp }}/host-${{ matrix.pi }}"
      - name: Retain host lock and version evidence for replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-${{ matrix.pi }}
          path: ${{ runner.temp }}/host-${{ matrix.pi }}
          if-no-files-found: warn
