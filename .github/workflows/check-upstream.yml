name: Check upstream drift

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Check reviewed upstream baseline
        run: |
          git remote add upstream https://github.com/oversk7/pi-pwsh-notify.git
          npm run check:upstream -- --fetch
